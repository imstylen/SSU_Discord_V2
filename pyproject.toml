[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ssu-membership"
version = "1.0.0"
description = "Manual SSU membership administration and Discord entitlement bridge"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "jinja2>=3.1.6,<4",
  "sqlalchemy>=2.0.38,<3", "discord.py>=2.5,<3", "httpx>=0.28,<1",
  "pydantic-settings>=2.8,<3", "python-multipart>=0.0.20,<1",
  "itsdangerous>=2.2,<3", "email-validator>=2.2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["app*", "bot*"]

[tool.setuptools.package-data]
app = ["templates/*.html", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
